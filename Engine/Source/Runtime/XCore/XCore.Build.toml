#   * Partial C1 -- IsA hierarchy walk correctness (FFieldCastAcceleration.cpp);
#                   the depth-bound performance gate lands at Phase 4b.4.
#   * F3 -- No descriptor type contains a virtual method (verified by
#           is_trivially_copyable + is_trivially_destructible asserts).
