# JUDGEMENT CALL (Phase 4b.4b / kFObjectPropertyBase parent gate bit).
# XPact's FProperty subclass hierarchy is FLAT per Prime Directive
# (§5.6 FIX-R2-LOW-7): FObjectProperty, FWeakObjectProperty,
# FSoftObjectProperty, FClassProperty, FSoftClassProperty all derive
# directly from FProperty (NOT via UE's intermediate FObjectPropertyBase
# class). The semantic predicate "is this property an object-reference?"
# is expressed via a synthetic kFObjectPropertyBase CastFlags bit that
# every member of the family OR-includes. A single AND test against
# kFObjectPropertyBase resolves the predicate; no extra class node is
# required. This is more compact AND faster than UE's hierarchy walk.
#
# JUDGEMENT CALL (Phase 4b.4b / FStruct / FArray / FMap / FSet dispatch
# slots are no-ops at Phase 4b.4b). The FFakeVTable slot signatures
# (Instance, ElementIndex, OutValue / InValue) do NOT carry the
# per-instance FProperty* needed to know the nested struct / array
# inner / map key+value types. At Phase 4b.4b the bytewise dispatch
# slots for container types are no-ops; ContainsObjectReference
# returns conservative-true (caller checks Inner / Key / Value /
# Element for precise answer). Phase 4b.5 will rewire the slots to
# delegate to FStruct's FCppStructOps or to walk via Inner FProperty
# typed dispatch. This is the spec-aligned posture per FIX-13 deferral
# language.
#
# JUDGEMENT CALL (Phase 4b.4b / FObject forward decl). The dispatch
# slot bodies for FObjectProperty / FInterfaceProperty / FDelegateProperty
# manipulate `FObject*` pointers. FObject (the GC-managed base) lands
# at XCoreXObject (System 5). Phase 4b.4b forward-declares FObject in
# the FObjectProperty.h header; the slot bodies operate on pointer-
# sized chunks without dereferencing FObject. The forward declaration
# is sufficient for the structural reflection layer.
