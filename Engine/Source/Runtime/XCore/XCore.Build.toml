# JUDGEMENT CALL (Phase 4b.2 / FGuid placement). XCore-4a did NOT ship
# FGuid (verified by grep across Engine/Source/Runtime/XCore at Phase
# 4b.2 dispatch time). Per the Prime Directive (do it right the first
# time), Phase 4b.2 introduces FGuid in the XCore::Reflect namespace
# co-located with FCustomVersion -- the alternative of using a raw
# `uint8 Key[16]` for the Key field would be (a) less ergonomic at
# call sites, (b) less typed (any 16-byte buffer would compile-fit),
# and (c) require a later refactor when XCore-4a or downstream layers
# need GUIDs for their own purposes (asset import, network identifiers,
# etc.). The Reflect-namespace placement matches the spec body wording
# ("FGuid Key") and keeps the type discoverable from the reflection
# tier where it is most heavily used.
