# JUDGEMENT CALL (Phase 5.f / heap-range reconciliation).
#
# Spec §5.1 envisions a single contiguous reserved VM range for the
# XObject heap. The current FXObjectAllocator (Phase 5.b) uses a slab-
# based allocator over FMallocBinnedX, which produces multiple
# disjoint slabs.
#
# Phase 5.f's card table is parameterised by [HeapBase, HeapBase +
# HeapByteSize) at Initialize-time. Out-of-range MarkCardDirty calls
# are silently ignored (clamped to bounds checking; no card is dirtied
# for an address outside the registered range).
#
# This is the principled posture for Phase 5.f:
#   * The card table is a separable component with a well-defined
#     contract.
#   * The FXObjectAllocator integration (Phase 5.b' or a follow-up)
#     will either (a) reserve a contiguous VM range up-front matching
#     spec §5.1 design, OR (b) extend the card table to handle
#     multiple disjoint ranges.
#   * For Phase 5.f, the unit-tested contract is "address within the
#     registered range marks the corresponding card; address outside
#     the range is a no-op".
#
# Documented inline at FXObjectGCCardTable.h's "HEAP-RANGE NOTE"
# block + the IntegrationWithAllocator test's scope-note.
#
# TODO(Phase 5.f' / 5.h integration): wire the FXObjectAllocator to
# either reserve a contiguous heap range or register each slab with
# the card table. The card-table API (Initialize taking a single
# (base, byteSize) tuple) accommodates either resolution.
#
# JUDGEMENT CALL (Phase 5.f / wait-free MarkCardDirty).
#
# Per spec §4.5: "MarkCardDirty is wait-free; cost is one byte store".
# Phase 5.f honours this: the card byte write is non-atomic
# (single-byte stores are atomic at the hardware level on every
# supported platform; the consumer side (ForEachDirtyCardAndClear)
# runs only during the GC safepoint window so no mutator concurrently
# writes during the clear).
#
# The m_dirtyCount counter IS atomic (relaxed RMW on every MarkCard
# Dirty) because it's read concurrently from the GC trigger thread.
# The relaxed RMW costs ~3 cycles; the worst-case race is an over-
# count of +1 per concurrent writer racing on a clean-to-dirty
# transition (saturation predicate has 50% slack; the over-count
# tolerance is well within bounds).
#
# JUDGEMENT CALL (Phase 5.f / per-thread SATB queue wait-free path).
#
# Per spec §5.6 + Rev 2 FIX-A-MED-37: the queue is per-thread (TLS);
# the Push fast path is wait-free (single relaxed atomic increment +
# slot write). The slow path (queue full) drains into the global log
# under the global log's lock; the drain is amortised (256 stores
# per drain).
#
# The drain-accept gate (g_XGCAcceptDrains) is checked BEFORE the
# drain; if false, the writer blocks on XGCWaitForDrainsAccepted (a
# spin-yield primitive bounded by the cascade timeout). Phase 5.j
# hot-reload sets/clears the gate; Phase 5.f provides the plumbing.
#
# JUDGEMENT CALL (Phase 5.f / TLS access via TModuleSafeThreadLocal).
#
# Per Rev 2 FIX-A-CRIT-TC1 + spec §5.6 + the TModuleSafeThreadLocal.h
# rationale (hot-reload stale-slot hazard). Raw `thread_local` storage
# would be a footgun on hot-reload paths; the TLS slot is allocated
# via FPlatformTLS::AllocSlot and the per-thread storage is heap-
# allocated. The slot index is the only handle to per-thread data;
# on module unload the slot is freed + every thread's pointer for
# that slot becomes unreachable but does NOT outlive the module's
# code.
#
# A sentinel "fallback" queue handles the unlikely case that
# AllocSlot exhausted the OS slot table (~1024 slots on Win64; XPact's
# TLS usage is well under that). The fallback degrades performance
# (per-Push global-lock acquisition) but preserves correctness.
#
# JUDGEMENT CALL (Phase 5.f / global SATB log uses FCriticalSection +
# FMemory grow-under-lock).
#
# A lock-free MPSC queue would be more performant for the mark-phase
# drain, but the drain is RARE (typically once per ~256 stores per
# thread = once every few thousand stores; for a tick with 100k
# stores across 8 threads, ~50 drains/sec). The FCriticalSection
# approach is simpler to reason about + the cost is amortised.
#
# A future Phase 2 may swap to TBoundedMpscQueue if profiling
# indicates drain contention is meaningful. Documented inline at
# XGCConcurrentState.h's body comment.
#
# JUDGEMENT CALL (Phase 5.f / 3-color enum + invariant doc).
#
# Per Rev 2 FIX-A-MED-34 / MAJOR-A11: the spec wants the 3-color
# invariant documented at the implementation surface. Phase 5.f
# ships:
#   * XGCColorInvariant.h header: documentation-only with the
#     EXObjectGCColor enum (White=0, Gray=1, Black=2; uint8).
#   * Inline docs at XGCWriteBarrier.h: barrier semantics in terms
#     of pre-store SATB capture + the invariant it preserves.
#
# The COLOR ENUM is not stored on the XObject -- it's INFERRED from
# the reachability flag (XObject::ReachabilityFlag, offset 36, Rev 3
# per FIX-M-R2-3) + presence in the worker's gray queue. Phase 5.g
# will read the bit + walk the queue; the enum exists so cross-phase
# code can name colors with type-safety.
#
# JUDGEMENT CALL (Phase 5.f / XPACT_HAS_XCOREXOBJECT_STRONG_GC gate).
#
# The XCore-4a-side weak-symbol stub (XGCWriteBarrierStub.cpp) is
# STRONG-linkage on MSVC (no portable function-level weak attribute).
# Without a gate, the MSVC link would fail with LNK2005 when the Phase
# 5.f strong-symbol TU ships in the same DLL.
#
# The gate is a sentinel header
# (XGCWriteBarrierStrongSymbolGate.h) defining
# XPACT_HAS_XCOREXOBJECT_STRONG_GC = 1 unconditionally; the stub's
# body is `#if !XPACT_HAS_XCOREXOBJECT_STRONG_GC`-skipped. When Phase
# 5.f ships, the stub becomes a no-op TU.
#
# This is the principled gate per Prime Directive:
#   1. No source change to XCore-4a's container code (TArray.h /
#      XGCDeclarations.h) is required.
#   2. The weak-symbol pattern still works on Clang/GCC (the weak
#      attribute is in scope of the #if; either path is correct).
#   3. The MSVC duplicate-symbol hazard is closed.
#   4. The gate header is the explicit signal; consumers can probe
#      it via XPACT_HAS_XCOREXOBJECT_STRONG_GC if they need to
#      conditionally compile.
#
