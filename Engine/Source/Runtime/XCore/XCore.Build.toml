# JUDGEMENT CALL (Phase 5.g / safe-point handshake MVP scope).
#
# Per Rev 2 FIX-A-MED-36 + spec §4.7: the MVP is a "dedicated marker
# thread; post-XTaskGraph: worker-pool integration". Phase 5.g
# implements the MVP. The safe-point handshake scope:
#
#   * CollectGarbage is callable ONLY from the main thread. The main
#     thread IS at safe-point by virtue of having called the API.
#
#   * The Phase 5.g dedicated marker thread is the consumer of the
#     safe-point (it runs the mark phase). It does NOT participate
#     as a mutator.
#
#   * Worker mutators are absent in the current build:
#       - FXObjectAllocator runs synchronously on the calling thread.
#       - No slab-coalesce background thread exists.
#       - The Phase 5.f card-table maintenance is synchronous-on-store
#         (the write barrier dirties cards inline; no background
#         scrubber).
#     The g_XGCSafePointRequested flag is set/cleared by the
#     collector; the documented future-work hook (poll loop over
#     registered mutators) is the natural extension point when
#     XTaskGraph integration lands.
#
# The full XTaskGraph-integrated handshake (every worker thread polls
# safe-point at back-edges; collector waits for all-quiesced before
# proceeding) is post-System-8 work. Phase 5.g documents the MVP
# scope at FXObjectCollector.h's SAFE-POINT HANDSHAKE block.
#
# JUDGEMENT CALL (Phase 5.g / FXGrayQueue Chase-Lev deque vs
# bounded-LIFO + global overflow).
#
# Two principled implementation options for the work-stealing gray
# queue:
#
#   1. Chase-Lev work-stealing deque -- lock-free; owner pushes/pops
#      from the bottom (LIFO); stealers pop from the top (FIFO).
#      Canonical for work-stealing schedulers (TBB, Cilk, Tokio).
#      Pros: zero contention in steady state. Cons: non-trivial
#      memory-ordering invariants; ~400 LoC of careful CAS-loop code.
#
#   2. Per-thread bounded LIFO + global MPSC overflow list -- TLS
#      256-entry buffer (matches FXObjectSatbQueue's discipline) +
#      global FCriticalSection-protected vector for spill aggregation.
#      Pros: simple; bounded latency for the local case; the global
#      list IS the natural termination-detection surface. Cons: not
#      lock-free in the overflow path.
#
# Phase 5.g ships OPTION 2 (bounded LIFO + overflow). Per Prime
# Directive: the MVP marker thread is the SOLE worker (one TLS
# queue). Work-stealing across workers is post-System-8 gated on
# XTaskGraph integration. The Chase-Lev complexity is unwarranted
# for a one-worker MVP. When multi-worker mark ships, the existing
# global overflow list IS the natural integration point; a follow-
# up phase can layer a Chase-Lev deque on top without changing the
# Push/Pop API surface or the consumer pattern.
#
# JUDGEMENT CALL (Phase 5.g / additive GC events vs spec §10.12).
#
# The spec §10.12 table enumerates three GC events:
#   * CycleComplete
#   * FullScanFallback
#   * RememberedSetSaturation
