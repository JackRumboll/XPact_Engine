# 1..10 holds; pathological: ~1k) but lets the GC-flag region (low
# 32 bits) and the refcount region (high 24 bits) mutate independently
# without cache-line ping-pong between the GC mark thread and the
# refcount-mutating application threads (both regions are within the
# same 64-bit word so the atomic CAS-loop preserves all bits, but the
# separation aids reasoning + future per-half independence if needed).
