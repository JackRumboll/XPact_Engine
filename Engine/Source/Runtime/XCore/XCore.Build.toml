# JUDGEMENT CALL (Phase 4b.5 / SPEC DRIFT NOTICE).
#
# The spec Rev 3 (FIX-R2-CRIT-1) re-derived all descriptor sizes under
# the assumption that XCore-4a TArray sizeof = 16 bytes via EBO of a
# stateless DefaultAllocator. The actual XCore-4a Phase 1c+ ships a
# DefaultAllocator that carries a 2-byte FMemTag for per-container
# memory attribution; [[msvc::no_unique_address]] on TArrayCore's
# allocator field has NO PADDING HOLE TO FOLD INTO (the 8+4+4 = 16
# data-member layout is tight) and the trailing alignment-to-8 forces
# sizeof(TArray<T>) == 24 on MSVC.
#
# Confirmed at Phase 4b.5 by direct sizeof measurement on MSVC 19.44.
# Spec values vs Phase 4b.5 audit-corrected actuals:
#
#   FStruct        spec 104 -> actual 112  (TArray cascade +8)
#   FScriptStruct  spec 120 -> actual 128  (FStruct +8, body unchanged)
#   FClass         spec 200 -> actual 224  (FStruct +8 + ClassReps/
#                                           NetFields +16 cumulative)
#   FEnum          spec  64 -> actual  72  (Values TArray +8)
#   FInterface     spec  56 -> actual  64  (InterfaceFunctions +8)
#
# Phase 4b.5 ships the audit-corrected sizes (which match Rev 2's pre-
# FIX-R2-CRIT-1 values). The static_asserts pin the ACTUAL byte sizes;
# false static_asserts that fail to compile are a Prime Directive
# violation (no compile-test, no integration-test). The spec drift is
# documented in every affected header's SPEC DRIFT NOTICE block.
#
# RESOLUTION PATHS for the user / spec author:
#
#   (A) Refactor XCore-4a so DefaultAllocator is truly stateless
#       (FMemTag moved to a per-thread default or a sidetable
#       indirection). Most spec-aligned path but XCore-4a-revision
#       work.
#
#   (B) Amend spec to acknowledge TArray = 24 (revert FIX-R2-CRIT-1's
#       claim to Rev 2's values). Update XPACT_F*_LAYOUT_TAG strings.
#
# Phase 4b.5 implements path (B)'s observable layouts; recommend path
# (A) for follow-up because the per-instance FMemTag belongs at the
# container-of-the-allocator level (TArrayCore), not the allocator
# level, to preserve EBO's effectiveness across the engine.
#
# JUDGEMENT CALL (Phase 4b.5 / FStruct non-copyability).
#
# FStruct carries a std::atomic<FUnversionedStructSchema*> and a
# TArray<FProperty*>; both forbid trivial copy. Spec §7.1 doesn't
# pin trivial-copyability on FStruct (only the 104/112-byte size
# lock). Phase 4b.5 explicitly DELETES the copy + move surface on
# FStruct (and via inheritance on FScriptStruct + FClass) so misuse
# is a compile error rather than silent UnversionedSchema corruption
# or TArray aliasing. The trivially-copyable static_assert from
# FProperty / FField (which IS trivially copyable) does NOT apply
# to FStruct.
#
# JUDGEMENT CALL (Phase 4b.5 / FEnum + FInterface FFieldClass).
#
# FEnum + FInterface extend FField but do NOT participate in the
# FProperty CastFlags hierarchy (spec §5.5 reserves bits 0-28 for
# FProperty subclasses; FEnum/FInterface have no dedicated cast bit).
# Their FFieldClass anchors carry CastFlags::kNone and SuperClass =
# &kFieldStaticClass. IsA(FEnum::StaticClass()) on an FEnum instance
# resolves via the SuperClass chain walk (the spec §13 gate C1's
# depth bound easily accommodates the 2-step walk; performance is
# not a concern at the FEnum population scale).
#
# JUDGEMENT CALL (Phase 4b.5 / ForEachProperty templated body).
#
# FStruct::ForEachProperty is a templated header-inline so each call
# site monomorphises the visitor. The chain walker references
# FProperty::PropertyLinkNext; rather than pulling FProperty.h into
# FStruct.h transitively, the template body delegates to a free
# function ForEachPropertyAdvance whose body lives in FStruct.cpp
# (where FProperty is fully visible). Adds one indirect call per
# visit; the cost is bounded by chain length (typically <20).
#
# JUDGEMENT CALL (Phase 4b.5 / FClass::Link conservative chains).
#
# DestructorLink + PostConstructLink at Phase 4b.5 use a conservative-
# all-properties policy (every FProperty threads into both chains).
# UE's UStruct::Link filters by CPF_NoDestructor + CPF_NeedCtorLink
# respectively; XPact's EPropertyFlags doesn't yet include those bits
# in the Phase 4b.4a MVP set. The conservative posture is correct:
# extra dispatch calls on trivially-destructible properties are
# no-ops (the dispatch wrapper short-circuits via the slot null-check).
# Phase 4b.6 refines once the filter bits join EPropertyFlags.
#
# Acceptance gates covered (Phase 4b.5):
#   * B1 -- sizeof per §11.3 (audit-corrected) verified via
