# Cross-TU init-order safety: `s_XObjectAllocator` itself is a
# zero-initialised global (the strong definition in
# XObjectAllocatorBootstrap.cpp uses default value-init = nullptr).
# Value-initialisation precedes ALL dynamic init in the program (per
# [basic.start.static]/2), so the registration ctor sees a well-defined
# nullptr slot and replaces it with the function pointer atomically
