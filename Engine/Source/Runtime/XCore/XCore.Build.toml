#                                            Idempotent Register* (defense-
#                                            in-depth for the XBT build-
#                                            time fix M-7 scan).
#   Public/HAL/FStatId.h                 -- 64-bit compile-time stat ID
#                                            (fix M-3). 24-byte ABI-locked
#                                            struct: { uint64 Hash;
#                                            const char* Name;
#                                            const char* Group; }.
#   Public/HAL/FStatTLS.h                -- per-thread shard accessor
#                                            + XSTAT_DECL / XSTAT_INC /
#                                            XSTAT_ADD / XSTAT_SCOPE_CYCLE
#                                            macros. Constexpr FNV-1a-64
#                                            hash function shared between
