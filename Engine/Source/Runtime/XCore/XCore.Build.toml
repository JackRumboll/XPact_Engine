# (the scenario-boundary mark-region clearing public surface), changes
# CoalesceIdleSlabs return semantics from int32 slab-count to int64
# bytes-returned (the Foundation Prototype dashboard's canonical
# metric), adds the IdleSlabCoalesced telemetry event (additive to
# spec §10.12), and ships the OnScenarioBoundary multicast delegate
# (forward commitment: XScenarios broadcasts; XCoreXObject subscribes).
