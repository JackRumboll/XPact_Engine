#                                                FName("Field") on first
#                                                call via the C++ runtime's
#                                                static-init lock.
#
# JUDGEMENT CALL (Phase 4b.3 / lazy-init kFieldStaticClass.Name).
# FName(const char*) is not constexpr (it touches the FNamePool intern
# table at runtime), so the kFieldStaticClass Name slot cannot be
# populated at constinit time. The alternative -- dropping constinit
# entirely and constructing kFieldStaticClass via a function-local
# static -- would defeat the §5.2 design intent that XHT-emitted
# `.gen.cpp` populates FFieldClass instances at constinit. The lazy-
# init posture (constinit with NAME_None; first-access bumps to
# FName("Field")) preserves the constinit shape and incurs O(1) overhead
# on first access only.
#
# A future Phase 4b.6 (XReflectionRuntime registry) will replace this
# lazy-init with an eager pass at EInitPhase::PostStaticInit that walks
# every constinit FFieldClass and populates the Name slot. Until then,
# the GetFieldStaticClass() accessor is the supported entry point.
#
# Acceptance gates covered:
