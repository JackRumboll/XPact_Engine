# JUDGEMENT CALL (Phase 4b.4a / FFakeVTable function-pointer cast).
# The constinit FFakeVTable initialiser uses `(void(*)(void))&Fn` C-
# style casts to populate Slots[] from typed function pointers. C-style
# function-pointer-to-function-pointer casts ARE reinterpret_cast
# per [expr.reinterpret.cast]/8 and NOT formally a constant expression
# per [expr.const]/5.10. In practice every major compiler (MSVC 19.30+,
# Clang 13+, GCC 11+) accepts the pattern at constinit scope because
# the storage bytes are the function's address verbatim -- no actual
# byte transformation occurs at the cast site. The spec §5.4 example
# uses the same pattern. Phase 4b.4a follows it.
#
# JUDGEMENT CALL (Phase 4b.4a / is_standard_layout_v dropped).
# Phase 4b.3's FField static_assert pinned is_standard_layout_v.
# FProperty is NOT formally standard layout per [class]/7 (both FField
# AND FProperty have non-static data members; the rule allows at most
# one base class with data members). The Phase 4b.4a static_assert
# discipline DROPS is_standard_layout_v for FProperty + every subclass
# but KEEPS is_trivially_copyable_v + is_trivially_destructible_v.
# offsetof() remains well-defined in practice on every supported
# compiler for single-inheritance + POD-throughout types -- this is
# explicitly documented in §5.3 of the spec and matches UE's FProperty
# discipline.
#
# JUDGEMENT CALL (Phase 4b.4a / SchemaHash slot deferred).
# The §5.4 slot table includes AppendToSchemaHash (slot 13). The full
# SchemaHash discipline (canonical byte-stream emission per FIX-10
# §8.4) lands at Phase 4b.6 when XReflectionRuntime + the canonical
# stream format are finalised. Phase 4b.4a populates the slot as
# nullptr on every subclass; the Capabilities bit for slot 13 is
# clear; the FProperty wrapper currently has no AppendToSchemaHash
# accessor (would forward to ::Hash::FBlake3 once SchemaHash ships).
#
# JUDGEMENT CALL (Phase 4b.4a / FArchive deferred).
# Slots 7 (SerializeItem) + 8 (NetSerializeItem) take an FArchive&.
# FArchive lands in XSerialization (Layer 9; post-XCore-4b). Phase
# 4b.4a forward-declares FArchive + FPropertyTag in FProperty.h and
# populates both slots as nullptr on every primitive subclass. The
# FProperty wrapper methods (SerializeItem, NetSerializeItem) probe
# HasSlot before dispatch, so calling them today is a no-op (returns
# false for NetSerializeItem).
#
