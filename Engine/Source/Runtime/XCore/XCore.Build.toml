# ~400 LoC scalar implementation runs at runtime only). The principled
# alternative is a constexpr FNV-1a-64 used at BOTH compile time
# (XSTAT_DECL) AND runtime (FStatTLS::Inc/Add slot lookup); both
# paths must produce the same Hash for the same (Name, Group) tuple.
# Collision probability at <=10K stats: ~2.7e-12 (identical to XXH3's
# 64-bit birthday bound; the M-3 wording is preserved).
#
# TODO(Phase 1g audit cycle): if a constexpr XXH3 implementation
# ships in FXxh3, swap FNV-1a-64 for constexpr XXH3 simultaneously
# at the XSTAT_DECL site and the runtime FStatTLS path. The runtime
# slot lookup uses FStatId.Hash directly so the swap is symmetrical.
#
# JUDGEMENT CALL (Phase 1f Subagent A). The Phase 1f FStatRegistry::
# MergeFromAllThreads sweeps only the calling thread's shard plus
# the exit-overflow queue. The multi-thread sweep (live threads'
# shards via FThreadRegistry) is Phase 1g work; the unit tests are
# structured so all worker threads exit BEFORE Merge runs, which
# routes their counts through the exit-overflow queue (the path
# that is exercised in Phase 1f).
#
# JUDGEMENT CALL (Phase 1f Subagent A). The FStatShard fall-through
# overflow path in Section 10.5 spec wording calls for a
# TMap<uint64, int64>. Phase 1f ships a fixed-size 16-entry linear-
# array fallback instead because (a) the overflow path is "rare"
# per spec, (b) pulling TMap into the hot-path TU couples Stat to
# the Container layer unnecessarily, (c) the 16-entry cap is
# sufficient for the expected stat-name population (<=10K total,
# of which <=8 colliding on any one primary slot is the failure
# case the overflow captures). Phase 1g audit cycle can swap in
# TMap if the measured overflow rate justifies the indirection.
#
# JUDGEMENT CALL (Phase 1f Subagent A). XPACT_TLS_MODULE_SAFE is
# forward-declared in XPactMacros.h but its Platform-HAL definition
# is out-of-scope for Phase 1c (only the forward decl shipped). The
# Phase 1f FStatTLS.cpp falls through to a plain thread_local on
# every target. This is safe for the unit-test surface (single-DLL
# test process; no DLL unload). Phase 1g audit cycle wires
# TModuleSafeThreadLocal once the Platform HAL implementation ships.
#
# Phase 1d already adds one external dependency on the vendored
# tl_expected polyfill at /Engine/Source/ThirdParty/tl_expected/ --
# header-only, CC0/MIT, backs Result<T,E> on C++20 toolchains. Phase 1f
# adds no further private deps.
#
# =====================================================================
#
# Phase 1b source layout:
#
#   Private/HAL/                       -- cross-platform .cpp files:
#       FPlatformAtomics.cpp           -- std::atomic_ref-backed atomics
#                                         (Section 7.6 row 3; one TU
#                                          compiles for all 3 platforms).
#       FDateTime.cpp                  -- FDateTime body; the only
#                                         platform-divergent code is
#                                         CaptureWallclockMicros which
#                                         is `#if XPACT_PLATFORM_*`
#                                         gated inline.
#       XDateTimeAlgorithms.cpp        -- ISO 8601 parse/emit + Howard
#                                         Hinnant primitives.
#       XInitPhase.cpp                 -- pre-existing (Phase 1a).
#
#       FMemory.cpp                    -- Step 4 allocator facade
#                                         (dispatcher to FMallocBinnedX).
#       FMallocBinnedX.cpp             -- Step 4 binned allocator body
#                                         (UE Binned3 descendant; 56 bins
#                                          32 B - 16 KiB; per-bin 1 GiB
#                                          VM reservation).
#       FTLSBinCache.cpp               -- Step 4 per-thread bin cache
#                                         (lazy-init; native thread_local
#                                          for Phase 1b; TModuleSafeThreadLocal
#                                          swap-in for Phase 1c).
#       FMemoryConfig.cpp              -- Step 4 OOM-policy active global
#                                         + test-only setter.
#
#       FLeakTracker.cpp               -- Step 5 leak tracker
#                                         (per-tag shadow table; LRU
#                                          eviction at 10 M live cap;
#                                          installs FMemory Malloc/Free
#                                          hooks).
#
#       FCriticalSection.cpp           -- Step 6 recursive mutex
#                                         (Win64: CRITICAL_SECTION;
#                                          POSIX: pthread_mutex_t with
#                                          PTHREAD_MUTEX_RECURSIVE).
#       FMutex.cpp                     -- Step 6 non-recursive mutex
#                                         (Win64: SRWLOCK exclusive;
#                                          POSIX: pthread_mutex_t with
#                                          PTHREAD_MUTEX_NORMAL).
#       FRWLock.cpp                    -- Step 6 shared mutex
#                                         (Win64: SRWLOCK shared/exclusive;
#                                          POSIX: pthread_rwlock_t).
#       FEvent.cpp                     -- Step 6 waitable event
#                                         (Win64: CreateEventW + Wait*;
#                                          POSIX: condvar + mutex + flag).
#       FConditionVariable.cpp         -- Step 6 condvar
#                                         (Win64: CONDITION_VARIABLE +
#                                          SleepConditionVariableSRW;
#                                          POSIX: pthread_cond_t).
#
#   Phase 1c also modifies FMallocBinnedX.cpp / FMallocBinnedX.h to
#   swap the cross-thread reclaim path from a simple Treiber stack
#   to TBoundedMpscQueue<FFreeBlock*, 4096> per Section 8.1 fix
#   B-C4. The Treiber stack stays as a fallback for queue-full
#   conditions (rare under normal operation; consumer drains
#   continuously).
#
#   Private/HAL/StackWalk/             -- per-platform stack walkers
#                                         (each .cpp gates its body on
#                                          XPACT_PLATFORM_* so only one
#                                          compiles per target):
#       Win64StackWalk.cpp             -- RtlCaptureStackBackTrace + dbghelp.
#       UnixStackWalk.cpp              -- backtrace + backtrace_symbols.
#       AndroidStackWalk.cpp           -- _Unwind_Backtrace + dladdr;
#                                         libunwindstack richer-info is
#                                         the Step 5 follow-up commit.
#
#   Private/HAL/Windows/               -- Win64-only .cpp files:
#       Win64PlatformMisc.cpp
#       Win64PlatformTime.cpp
#       Win64PlatformProcess.cpp
#       Win64PlatformMemory.cpp
#       Win64PlatformProperties.cpp
#
#   Private/HAL/Unix/                  -- Linux-only .cpp files:
#       LinuxPlatformMisc.cpp
#       LinuxPlatformTime.cpp
#       LinuxPlatformProcess.cpp
#       LinuxPlatformMemory.cpp
#       LinuxPlatformProperties.cpp
#
#   Private/HAL/Android/               -- Android-only .cpp files:
#       AndroidPlatformMisc.cpp
#       AndroidPlatformTime.cpp
#       AndroidPlatformProcess.cpp
#       AndroidPlatformMemory.cpp
#       AndroidPlatformProperties.cpp
#
# Per-platform gating mechanism: each per-OS .cpp wraps its body in
# `#if XPACT_PLATFORM_WIN64` / `#if XPACT_PLATFORM_LINUX` /
# `#if XPACT_PLATFORM_ANDROID` (the XPACT_PLATFORM_* macros are defined
# in Macros/XPactMacros.h lines 421-439, keyed off _WIN64 / __linux__ /
# __ANDROID__). XBT discovers every .cpp recursively (BuildMode.cs
# EnumerateModuleFiles line 2023) and submits them all to the
# toolchain; the wrong-platform .cpp files compile to empty TUs.
#
# TODO(Phase 2 XBT integration): once XBT grows a typed per-platform
# source filter (e.g., a `[private_sources]` TOML table with
# `@expr` references like `if target.platform == 'Win64'`), the macro
# gates can be removed in favour of the parser-side filter. The
# benefit is faster compile times on non-host platforms (the empty TU
# still incurs a toolchain invocation; the parser-side filter would
# skip the invocation entirely). For Phase 1b the macro gate is
# the principled minimum-viable approach.
#
# Step 4 + Step 5 link-dependencies (Section 4.6 + Section 12.5):
#   * Win64:    dbghelp.lib via Win64StackWalk.cpp's
#                #pragma comment(lib, "dbghelp.lib"). No TOML wiring
#                needed (MSVC honours the pragma).
#   * Linux:    libc-shipped backtrace + backtrace_symbols; -rdynamic
#                linker flag recommended for full symbol resolution.
#                TODO(Phase 1c): wire -rdynamic once the per-target
#                linker-flag TOML schema lands.
#   * Android:  -lunwind (NDK default). _Unwind_Backtrace lives in
#                libunwind which the NDK toolchain links by default.
#                TODO(Phase 1c): wire explicit `-lunwind` once the
#                link_libs TOML schema lands.
#
# =====================================================================

name = "XCore"
tier = "Engine"
module_type = "Runtime"
languages = "Cpp"

# Sim-path discipline: XCore is the foundation of EVERY downstream
# module including the sim-path TUs. Setting sim_path = false at the
# module level means XCore's headers can be included from both
# sim-path and non-sim-path TUs; the sim-path TU's overlay header
# (XSimPathMathOverrides.h) flips XPACT_SIMPATH = 1 at the TU level
# and turns on the sim-path-poisoning of libm / std::sqrt et al.
# This is the correct discipline-by-TU pattern (Section 6 of the
# spec); module-level sim_path is for downstream modules whose
# every TU is sim-path.
sim_path = false

# SimdLevel.Default: resolves at flag-derivation time by reading
# TargetRules.SimdLevelDefault (which the production target sets to
# SimdLevel.SSE42). SimPath modules are additionally clamped to <=
# SSE42 per Section 4.2; non-sim-path XCore is unconstrained.
simd_level = "Default"

# Public include paths -- the XCore-4a public API surface every
# downstream module compiles against.
public_include_paths = [
    "Public",
]

# Private include paths -- XCore-4a's internal helpers.
# Phase 1b adds XDateTimeAlgorithms.h under Private/HAL; it is
# consumed by FDateTime.cpp + XDateTimeAlgorithms.cpp (which deliver
# the ISO 8601 round-trip body) and by the per-OS .cpp files indirectly
# via #include "XDateTimeAlgorithms.h" (relative-to-Private path).
private_include_paths = [
    "Private",
    "Private/HAL",
    "Private/Internationalization",  # LocTableBytewise.h header-private helpers
]

# Dependencies.
#
# Phase 1d adds a public dependency on the `tl_expected` vendored
# polyfill module (Engine/Source/ThirdParty/tl_expected). The
# polyfill backs Result<T, E> on C++20 toolchains where
# std::expected is not yet shipped (per spec Section 13.1 fix B-M6;
# the C++23 std::expected branch is also supported and selected via
# __cpp_lib_expected feature-test in Macros/XResult.h). The
# dependency is `interface_module = true` -- tl_expected is a
# header-only third-party library with no compiled .cpp output, so
# there is no link edge; only include-path propagation. The
# `interface_module` flag tells XBT to treat the dep as
# header-only.
#
# The Win64 Platform .cpp files link against bcrypt.lib / Psapi.lib
# via #pragma comment(lib, ...) which is the Visual Studio-native
# dependency-injection path; XBT propagates the pragma to MSVC's
# linker without further configuration. Linux/Android need no
# external link beyond libc (all routines used are in glibc/Bionic).
public_dependency_modules = [
    { name = "tl_expected", interface_module = true },
    # Sleef-3.6+ scalar transcendental library (BSL-1.0) per
    # XCore-4a Rev 3 Section 14 Step 11.5.  Public dep so the
    # XSimPathMathOverrides.h header (which is /FI-included into every
    # sim-path consumer of XCore) can `#include "Sleef.h"` and resolve
    # via Sleef's public_include_paths field.  The link edge is real:
    # sim-path TUs that resolve XCore::Math to XCore::SimMath will
    # generate Sleef_sinf_u35 (etc.) call sites that require the
    # Sleef object archive at link time.  Non-sim-path consumers do
    # not include XSimPathMathOverrides.h (XBT only /FI-includes it on
    # sim-path modules per Contract Section 4.3) and do not call
