# Spec §6.5 says "8-byte StateBits has a refcount sub-field" but does
# not pin the exact bit positions. Phase 5.c allocates bits 32..55
# (24 bits = 16M strong-refs per object) for the refcount, leaving:
#   * bits 0..7   for the existing GC-flag bit assignments (bits 1, 2,
#                  3, 7 per spec §3.3 + FIX-A-HIGH-19)
