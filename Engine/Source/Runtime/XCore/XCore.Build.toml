# JUDGEMENT CALL (Phase 5.b / slab base alignment fix).
#
# The Phase 5.b dispatch's reference body used `Align = CellWidth` for
# FMemory::MallocOrAbort when allocating fresh slabs. CellWidth is NOT
# always a power-of-two (the spec §3.2 size-class table includes 96 /
# 192 / 384 / 768). FMemory::MallocOrAbort's pre-condition is
# `(Align & (Align - 1)) == 0` (power-of-two alignment). The reference
# body trips this check on the first 96-byte size-class slab commit.
#
# Phase 5.b ships the FIXED variant: slab base aligned to 64 (the
# smallest spec-defined cell width AND a typical cache-line size; both
# a power-of-two AND a multiple of every spec cell width's GCD).
# Every spec cell width (64/96/128/192/256/384/512/768/1024) is a
# multiple of 8 = alignof(XObject), so cell-offset alignment is
# preserved across the cell stride regardless of slab base alignment.
# Documented inline at the call site (FXObjectAllocator.cpp circa
# line 780).
#
# JUDGEMENT CALL (Phase 5.b / private static member helpers).
#
# The Phase 5.b dispatch's reference body placed FindClassPoolUnderLock,
# RegisterClassPoolUnderLock, ClassToSizeClass, and EnsureStateInitialised
# in an anonymous namespace + a free `static` function. Those helpers
# reference FXObjectAllocator::FState / FSizeClassPool / FClassPool /
# FSlab / FLargeSlab which are PRIVATE NESTED TYPES of
# FXObjectAllocator. C++ access control rejects this -- the friend-
# declaration alternative is fiddly across anonymous namespaces.
#
# Phase 5.b promotes the helpers to PRIVATE STATIC MEMBER FUNCTIONS
# of FXObjectAllocator (declared in the header alongside the public
# surface, defined in the .cpp). This is the principled fix per the
# Prime Directive: the nested types are intentionally private, and
# the helpers conceptually belong to the class. The alternative
# (friending each helper to the class) would add 4 friend declarations
# to the header without changing the helpers' semantics.
#
# JUDGEMENT CALL (Phase 5.b / bootstrap registration timing).
#
# The Phase 5.b dispatch wording targets EInitPhase::PostStaticInit
# for the RegisterXObjectAllocator call (matching FMallocBinnedX::Init
# timing). Phase 5.b registers EARLIER -- at TU dynamic-init via a
# namespace-scope static `FXObjectAllocatorAutoRegister` ctor, which
# runs before `main()` and before EInitPhase advances from
# PreStaticInit. By the time any PostStaticInit-or-later TU calls
# NewObject<T>, the hook is wired.
#
# Rationale: TU dynamic-init is the same lifecycle window that
# constinit FStatTLS + FAutoConsoleVariable already use to push onto
# their Treiber stacks. The pattern is engine-wide consistent. The
# alternative (explicit RegisterXObjectAllocator call from a
# PostStaticInit-tier bootstrap routine) would require a new
# XEngineInit entry point that has not been written yet.
