# JUDGEMENT CALL (Section 11.9 vendoring). The Section 11.9 wording
# describes BLAKE3 + XXH3 as "vendored at known revision". The Prime
# Directive engineering principles (do it right the first time) make
# the clean-room scalar implementation the principled choice rather
# than vendoring + SIMD-path-stripping:
#
#   * No risk of accidentally leaving a SIMD path enabled (the
#     upstream BLAKE3 + xxHash sources gate SIMD paths on compile-
#     time CPU detection; missing a path would silently break the
#     bit-exactness contract).
#   * No ThirdParty CMake / build-system entanglement.
#   * Whole surface reviewable in two ~400 LoC source files.
#   * Lower attack surface (fewer optional code paths).
#
# The clean-room implementations are verified against the upstream
# test vectors (BLAKE3 test_vectors.json + standard CRC-32C check
# string "123456789" -> 0xE3069283). The XXH3 reference-comparison
# acceptance lands at Phase 1e when the cross-platform CI loop exists.
