# stream format are finalised. Phase 4b.4a populates the slot as
# nullptr on every subclass; the Capabilities bit for slot 13 is
# clear; the FProperty wrapper currently has no AppendToSchemaHash
# accessor (would forward to ::Hash::FBlake3 once SchemaHash ships).
#
# JUDGEMENT CALL (Phase 4b.4a / FArchive deferred).
