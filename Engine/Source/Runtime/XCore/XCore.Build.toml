# 13.9 XPACT_FXOBJECTREFSCHEMA_LAYOUT_TAG) specifies:
#
#   * EXObjectRefSchemaOp : uint8_t (matches Op@0 1-byte slot per the
#     layout tag's per-field documentation)
#   * Sequential integer values: Terminator=0, Object=1, ...,
#     MulticastSparseDelegate=22, _Reserved255=255
#   * Separate per-opcode `uint64_t kObjectOp = 1ULL << 1` etc.
#     capability-bit constants for the "does this schema carry any
#     X-kind ref?" fast-query surface (orthogonal to opcode values)
#
# Phase 5.g' ships the spec-canonical form. The capability-bit
# constants are sibling inline constexpr declarations in
# FXObjectRefSchema.h; they match the layout tag's emit prose plus
# spec §7.4's documented `kObjectOp = 1ULL << EXObjectRefSchemaOp::
# Object` derivation. The static_asserts in the
# OpcodeEnumeration.cpp test pin both surfaces.
#
# Per Prime Directive ("Use the thing that is correct not the thing
# that is easier to implement"): the load-bearing ABI tag is the
# canonical source of truth; the dispatch prompt's draft was a
# shortcut sketch that DOES NOT survive contact with the byte-
# identity contract (a 4-byte Op slot would shift every subsequent
# field offset and break the layout pin).
#
# JUDGEMENT CALL (Phase 5.g' / TArrayCoreView byte-copy vs reinterpret-
# cast TArray<XObject*>).
#
# The first walker-impl draft reinterpret-cast the slot at
# `Instance + Offset` to a `TArray<XObject*>&`. This is incorrect:
# TArray<T*> with T derived from XCore::Reflect::XObject selects the
# GC-AWARE partial specialisation in TArray.h, which embeds a 32-byte
# m_rootSpan after the 24-byte TArrayCore prefix (total 56 bytes per
# slot). Reflected XPROPERTY container slots (TArray<XPtr<T>>) store
# the value as the NON-GC primary template (24 bytes; XPtr<T> is a
# distinct type from raw T*) so reinterpreting via the GC-aware spec
# reads past the slot's end.
#
# Phase 5.g' SHIPS the principled fix: the walker reads the slot's
# first 16 bytes via SchemaWalkerByteCopy into a TArrayCoreView
# `{const void* DataPtr; int32 Num; int32 Max}` struct that mirrors
# TArrayCore's documented layout. The reinterpret-cast hazard is
# avoided; the walker works against both the non-GC TArray spec and
# the GC-aware variant (the first 16 bytes are layout-compatible
# across both).
#
# JUDGEMENT CALL (Phase 5.g' / template-only header for monomorphisation).
#
# WalkSchemaRefs is a template parametrised on the Visitor type so
# the GC mark-phase consumer's visitor inlines at the call site
# (avoiding the vtable / std::function indirection on the GC hot
# path). This matches the discipline established for FXObjectArray::
# ForEachObject (Phase 5.b), XReflectionRuntime::IterateAllClasses
# (Phase 4b.6), and XGCRootSpanRegistry::ForEachValidObjectInSpans
# (Phase 5.e).
#
# The cost is per-T compile time (each unique visitor type produces
# a fresh instantiation); the GC mark phase uses ~1-2 distinct
# visitor types per build (one for the live mark, one for the
# remembered-set re-scan). Compile-time impact is bounded.
#
# JUDGEMENT CALL (Phase 5.g' / SchemaVectorEmitter standalone vs
# SourceEmitter integration).
#
# Phase 5.g' ships SchemaVectorEmitter as a standalone C# helper
# class (in XHT.Emitter) with byte-exact rendered-text unit tests
# (SchemaVectorEmitterTests in XHT.Tests). The production
# integration into the per-header .gen.cpp emit pipeline
# (SourceEmitter.cs) is DEFERRED to the Stage-B FClass emit phase
# because:
#
#   1. Current Stage-A .gen.cpp emit produces XClassDescriptor
#      records (per the XHT v8 Stage-A scope); the Stage-A
#      descriptor has NO RefSchema field. There is no slot to
#      attach the schema vector to.
#   2. The Stage-B FClass emit (which DOES carry RefSchema) lands
#      as a separate phase covering the full FClass constinit
#      shape (PropertyLink, DestructorLink, ObjectRefProperties,
#      RefSchema, SchemaHash, etc.). The schema-vector emit is one
#      of ~10 emit-pieces in that phase.
#
# Per Prime Directive ("Phase 2 / Stage B deferrals are legitimate
# when the dependency genuinely doesn't exist yet"): the Stage-B
# FClass emit IS a real un-shipped dependency. The schema-vector
# emit's standalone rendering is unit-tested in isolation so the
# emit logic is verifiably correct before the Stage-B integration
# adopts it. The standalone test surface IS the emit-rules
# regression suite.
