#                                    Object -> CollectGarbage (unreach
#                                    -> sweep enqueues on deferred
#                                    queue + sets BeginDestroyed /
#                                    PendingDestroy bits) -> Drain
#                                    OnePassWithBudget (FinishDestroy
#                                    dispatched + cell released + slot
#                                    bumped). Verifies NumLive
#                                    transitions + SerialNumber bump
#                                    invalidates the captured serial.
