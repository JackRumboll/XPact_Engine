#
# Phase 1e Subagent B (Step 11.5 Sleef vendoring + sim-path math) adds:
#
#   * Tests/Math/Sleef/SleefULP_Sqrt.cpp
#                                         -- 1000-input sweep across
#                                            Sleef_sqrtf_u10, verifying
#                                            max ULP error <= 10 (the
#                                            u10 tier guarantee). Per
#                                            XCore-4a Section 17.3
#                                            C-extra.
#   * Tests/Math/Sleef/SleefULP_Sin.cpp    -- 1000-input sweep across
#                                            [-pi, pi] for
#                                            Sleef_sinf_u35; max ULP
#                                            error <= 35 (u35 tier).
#   * Tests/Math/Sleef/CrossArchBitExact.cpp
#                                         -- 1000-step Verlet trajectory
#                                            using FVector + Sleef
#                                            cos/sin/sqrt; single-
#                                            platform repeatability gate
#                                            (Phase 1e). Phase 1g CI
#                                            shards run this test on
#                                            Win64-x86_64 / Linux-x86_64
#                                            / Android-ARM64 and byte-
#                                            compare the final state.
#                                            Section 17.3 C2 gate.
#   * Tests/Math/Sleef/NoFMAInstructionsLinked.cpp
#                                         -- Sleef-call-surface smoke;
#                                            the load-bearing FMA-
#                                            absence verification runs
#                                            in XBT.Toolchain.SleefFMACheck
#                                            via llvm-objdump -d disassembly
#                                            grep. Section 17.3 C-extra.
#   * Tests/Math/Sleef/SleefSymbolVariants.cpp
#                                         -- Verifies every Sleef _u10
#                                            / _u35 entry is linked +
#                                            non-null + distinct; the
#                                            link-time symbol-table dump
#                                            with banned-variant ban
#                                            (_avx2 / _sse4 / _neon /
#                                            _sve / _finz / _fma) runs
#                                            in XBT.Toolchain.SleefFMACheck.
#
# Subsequent phases (1f-1g: FText, CVars, cross-arch CI shards) add
# their TUs under this same module.
#
# Each test file is a standalone `int main()` so XBT can either:
#   (a) compile each .cpp as its own .exe (matching XBT.Tests's
#       per-fixture pattern), or
#   (b) compile them all into one aggregator .exe whose main() calls
#       each test's body (matching GoogleTest's pattern).
# The choice between (a) and (b) is the test-runner's concern, not
# this module's; the module declares its sources, the test runner
# does the rest.
#
# =====================================================================

name = "XCore.Tests"
tier = "Engine"
module_type = "Runtime"
languages = "Cpp"
b_is_test_module = true

# Sim-path: tests of sim-path-safe code can run as sim-path TUs;
# tests of non-sim-path code cannot. Phase 1a's macros are all
# sim-path-safe at the surface (they don't pull libm or wall-clock
# time), so this module COULD be sim-path. We leave it as non-sim
# until container-layer tests are added (where the sim/non-sim split
# is meaningful) -- mixed sim/non-sim within one module is awkward,
# and Phase 1a doesn't gain anything from sim-path discipline.
sim_path = false

simd_level = "Default"

# Include paths -- the tests are themselves leaf TUs (no headers
# exported); they consume XCore's Public headers.
public_include_paths = []
private_include_paths = []

# Dependencies -- the tests link against XCore. Public dep so the
# test TUs can include XCore's Public/* headers naturally.
public_dependency_modules = [
    { name = "XCore", interface_module = false },
]
private_dependency_modules = []

public_definitions = []
private_definitions = []
