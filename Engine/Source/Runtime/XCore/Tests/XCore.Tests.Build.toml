# Phase 1g fix MIN-4 -- test-runner orchestration contract:
# The two tests that depend on the SampleLoctables fixtures are:
#   * Tests/Internationalization/FText.Tests/LocaleSwitch.cpp
#   * Tests/Internationalization/FText.Tests/RoundTripBinary.cpp
# Both tests call XPact_GenerateSampleLoctables() directly in their
# bodies as a defense-in-depth measure. The test runner MUST invoke
# XPact_GenerateSampleLoctables(GetTempDirectory() + "/SampleLoctables/")
# in its per-process startup hook BEFORE running any FText.Tests test
# so that out-of-tree consumers that don't use the in-test
# self-bootstrap still find the fixtures. The .loctable binaries
# are NOT committed; see GenerateSamples.cpp header block for the
# rationale (keeps repo text-only-friendly + serializer-schema-
# drift-safe).
