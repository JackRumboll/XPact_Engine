# =====================================================================
# XCore.Tests -- the XCore-4a unit test module.
# =====================================================================
#
# Per XCore-4a Section 17 acceptance criteria, every XCore-4a TU has a
# corresponding test TU. Phase 1a (header macros + configuration)
# contributes the following compile-time + minimal-runtime tests:
#
#   * Tests/Macros/SizeofTypes.cpp       -- XCoreTypes.h ABI lock
#   * Tests/Macros/FNameForwardDecl.cpp  -- FName ABI lock (8 bytes)
#   * Tests/Macros/MacroExpansion.cpp    -- XPACT_* macro compile test
#   * Tests/GC/SpanLayout.cpp            -- XGCRootSpan 32-byte lock
#   * Tests/HAL/PhaseAdvancement.cpp     -- __AdvanceInitPhase contract
#
# Subagent B's Platform HAL Phase 1a tests already live under
# Tests/HAL/{FPlatformAtomics,FPlatformMisc,FTimespan,FDateTime}.Tests/;
# this single test module aggregates both subagents' Phase 1a output
# so the build runs them as one .exe (or one test binary).
#
# Phase 1b (Step 4 allocator + Step 5 leak detection) adds:
#
#   * Tests/HAL/FMemory.Tests/MallocFreeRoundTrip.cpp
#                                         -- 100K random Malloc/Free
#                                            (Section 17.1 A1).
#   * Tests/HAL/FMemory.Tests/MallocAlignments.cpp
#                                         -- align in {1, 8, 16, 32, 64}
#                                            (Section 4.6 unit test).
#   * Tests/HAL/FMemory.Tests/MallocOrAbort.cpp
#                                         -- MallocOrAbort smoke (death
#                                            test deferred to Phase 1c).
#   * Tests/HAL/FMemory.Tests/CrossThread.cpp
#                                         -- 8-thread alloc + cross-thread
#                                            free hammer (Section 17.1 A2).
#   * Tests/HAL/FMemory.Tests/FMemTagAccounting.cpp
#                                         -- per-tag GetAllocatedBytes
#                                            correctness.
#   * Tests/HAL/FMemory.Tests/FScopedNoAlloc.cpp
#                                         -- FScopedNoAlloc bookkeeping
#                                            (Section 4.3 fix A-MIN4).
#   * Tests/HAL/FLeakTracker.Tests/SyntheticLeak.cpp
#                                         -- 100x64-byte leak detection
#                                            (Section 17.9 I1; gated on
#                                             XPACT_LEAK_TRACKING_ENABLED).
#   * Tests/HAL/FLeakTracker.Tests/ShadowTableOverflow.cpp
#                                         -- LRU eviction counters smoke
#                                            (Section 12.2 fix A-MIN5;
#                                             gated on XPACT_LEAK_TRACKING_ENABLED).
#
# Phase 1c (Step 6 threading primitives) adds:
#
#   * Tests/HAL/FAtomicInt32.Tests/MemoryOrder.cpp
#                                         -- named-variant + generic
#                                            memory_order surface
#                                            (Section 8.7 + fix M-4).
#   * Tests/HAL/FAtomicInt32.Tests/CASContention.cpp
#                                         -- 8-thread CAS hammer
#                                            (Section 8.7 row 6).
#   * Tests/HAL/FAtomicInt64.Tests/MemoryOrder.cpp
#                                         -- 64-bit memory_order mirror.
#   * Tests/HAL/FCriticalSection.Tests/Recursion.cpp
#                                         -- same-thread Lock-Lock
#                                            (Section 8.7 row 1).
#   * Tests/HAL/FCriticalSection.Tests/Contention.cpp
#                                         -- 8-thread contended locks
#                                            (Section 8.7 row 1).
#   * Tests/HAL/FMutex.Tests/NonRecursion.cpp
#                                         -- deadlock-on-double-lock
#                                            + XIsNonRecursiveMutex
#                                            concept (Section 8.7 row 2).
#   * Tests/HAL/FRWLock.Tests/ReadersAndWriters.cpp
#                                         -- 4R + 1W concurrency
#                                            (Section 8.7 row 3).
#   * Tests/HAL/FEvent.Tests/AutoReset.cpp
#                                         -- single-Trigger -> one
#                                            waiter wakes (Section 8.7).
#   * Tests/HAL/FEvent.Tests/ManualReset.cpp
#                                         -- single-Trigger -> all
#                                            waiters wake (Section 8.7).
#   * Tests/HAL/FConditionVariable.Tests/WaitNotify.cpp
#                                         -- producer/consumer + NotifyAll
#                                            + concept-constraint
#                                            verification (Section 8.7
#                                            + fix M-5).
#   * Tests/HAL/TSpscQueue.Tests/OneProducerOneConsumer.cpp
#                                         -- 1P1C 100K round-trip
#                                            (Section 8.7 row 8).
#   * Tests/HAL/TMpscQueue.Tests/MPSC.cpp
#                                         -- 4P1C with per-producer
#                                            FIFO verification (Section
#                                            8.7 row 6).
#   * Tests/HAL/TBoundedMpscQueue.Tests/Backpressure.cpp
#                                         -- fill-to-capacity + drain
#                                            + multi-producer round-trip
#                                            (Section 8.7 fix B-C4).
#
# Phase 1c (Step 7 foundational containers) adds:
#
#   * Tests/Containers/TArray.Tests/AddRemoveCapacity.cpp
#                                         -- 100K Add + drain round-trip;
#                                            Max() monotonicity (Section
#                                            5.6).
#   * Tests/Containers/TArray.Tests/GrowthFactor.cpp
#                                         -- 1.375x grow formula verified
#                                            via ComputeGrowCapacity
#                                            (Section 5.1 / 5.6).
#   * Tests/Containers/TArray.Tests/MoveOnlyForGCAware.cpp
#                                         -- TArray<XObject*> move-only
#                                            (Contract Section 3.4 M1;
#                                            stub XObject for compile-
#                                            time check).
#   * Tests/Containers/TArrayView.Tests/Construction.cpp
#                                         -- view ctors: default, ptr+count,
#                                            C-array, TArray, initializer_list,
#                                            constexpr.
#   * Tests/Containers/TStaticArray.Tests/StackOnly.cpp
#                                         -- pure-stack allocation; no
#                                            heap interaction (Section
#                                            5.1 / 18 OPEN-4).
#   * Tests/Containers/TBitArray.Tests/FindFirstSet.cpp
#                                         -- 100K random pattern; brute-
#                                            force agreement (Section 5.6).
#   * Tests/Containers/TBitArray.Tests/CountSetBits.cpp
#                                         -- 100K random pattern; popcount
#                                            agreement + trailing-bit
#                                            normalization (Section 5.6).
#   * Tests/Containers/DefaultAllocator.Tests/TagPropagation.cpp
#                                         -- per-instance FMemTag carry
#                                            verified via
#                                            GetAllocatedBytes(Math)
#                                            (Section 5.5 row 2).
#
# Subsequent phases (1d container tests for TMap/TSet/FString, ...)
# add their TUs under this same module.
#
# Each test file is a standalone `int main()` so XBT can either:
#   (a) compile each .cpp as its own .exe (matching XBT.Tests's
#       per-fixture pattern), or
#   (b) compile them all into one aggregator .exe whose main() calls
#       each test's body (matching GoogleTest's pattern).
# The choice between (a) and (b) is the test-runner's concern, not
# this module's; the module declares its sources, the test runner
# does the rest.
#
# =====================================================================

name = "XCore.Tests"
tier = "Engine"
module_type = "Runtime"
languages = "Cpp"
b_is_test_module = true

# Sim-path: tests of sim-path-safe code can run as sim-path TUs;
# tests of non-sim-path code cannot. Phase 1a's macros are all
# sim-path-safe at the surface (they don't pull libm or wall-clock
# time), so this module COULD be sim-path. We leave it as non-sim
# until container-layer tests are added (where the sim/non-sim split
# is meaningful) -- mixed sim/non-sim within one module is awkward,
# and Phase 1a doesn't gain anything from sim-path discipline.
sim_path = false

simd_level = "Default"

# Include paths -- the tests are themselves leaf TUs (no headers
# exported); they consume XCore's Public headers.
public_include_paths = []
private_include_paths = []

# Dependencies -- the tests link against XCore. Public dep so the
# test TUs can include XCore's Public/* headers naturally.
public_dependency_modules = [
    { name = "XCore", interface_module = false },
]
private_dependency_modules = []

public_definitions = []
private_definitions = []
