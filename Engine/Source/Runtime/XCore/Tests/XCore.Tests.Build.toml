name = "XCore.Tests"
tier = "Engine"
module_type = "Runtime"
languages = "Cpp"
b_is_test_module = true

# Sim-path: tests of sim-path-safe code can run as sim-path TUs;
# tests of non-sim-path code cannot. Phase 1a's macros are all
# sim-path-safe at the surface (they don't pull libm or wall-clock
# time), so this module COULD be sim-path. We leave it as non-sim
# until container-layer tests are added (where the sim/non-sim split
# is meaningful) -- mixed sim/non-sim within one module is awkward,
# and Phase 1a doesn't gain anything from sim-path discipline.
sim_path = false

simd_level = "Default"

# Include paths -- the tests are themselves leaf TUs (no headers
# exported); they consume XCore's Public headers.
public_include_paths = []
private_include_paths = []

# Dependencies -- the tests link against XCore. Public dep so the
# test TUs can include XCore's Public/* headers naturally.
public_dependency_modules = [
    { name = "XCore", interface_module = false },
]
private_dependency_modules = []

public_definitions = []
private_definitions = []
